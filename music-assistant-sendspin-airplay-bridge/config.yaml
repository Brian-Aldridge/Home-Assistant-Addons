name: "Music Assistant SendSpin AirPlay Bridge"
version: "0.3.16"
slug: "music_assistant_sendspin_airplay_bridge"
description: "Manage Music Assistant AirPlay Receiver targets for selected SendSpin players and groups."
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
host_network: false
ingress: true
ingress_port: 8099
panel_icon: mdi:speaker-multiple
panel_title: SendSpin AirPlay Bridge
homeassistant: "2025.1.0"
map:
  - addon_config:rw
options:
  music_assistant_url: "http://homeassistant.local:8095"
  music_assistant_token: ""
  log_level: "info"
  mdns_interface: ""
  airplay_backend: "shairport-sync"
schema:
  music_assistant_url: url
  music_assistant_token: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  mdns_interface: str?
  airplay_backend: list(shairport-sync)
